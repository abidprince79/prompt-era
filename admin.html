<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Era Admin</title><link rel="stylesheet" href="admin.css"></head><body>
<div class="shell"><header><a class="brand" href="/"><span>✦</span> PROMPT <b>ERA</b></a><a href="/" class="back">← View site</a></header>
<main><section id="login" class="panel"><div class="eyebrow">PRIVATE ADMIN</div><h1>Prompt Era Admin</h1><p>Sign in to manage images and prompts.</p><input id="token" type="password" placeholder="Admin password"><button id="loginBtn">Sign in</button><small>Use the admin password provided for your site.</small></section>
<section id="app" class="hidden"><div class="top"><div><div class="eyebrow">CONTENT MANAGER</div><h1>Dashboard</h1><p id="count"></p></div><button id="logout" class="ghost">Log out</button></div>
<div class="grid"><section class="panel"><h2 id="formTitle">Add new prompt</h2><form id="postForm"><input type="hidden" id="postId"><label>Image<input id="image" type="file" accept="image/*" required></label><img id="preview" class="preview hidden" alt="Preview"><div class="two"><label>Title<input id="title" required placeholder="Cinematic AI Portrait"></label><label>Category<input id="category" required placeholder="AI Portrait"></label></div><div class="two"><label>Aspect ratio<select id="ratio"><option>1:1</option><option>4:5</option><option>9:16</option><option>16:9</option></select></label><label>AI style<input id="style" placeholder="Photorealistic"></label></div><div class="two"><label>Difficulty<select id="difficulty"><option>Beginner</option><option selected>Intermediate</option><option>Advanced</option></select></label><label>Tags<input id="tags" placeholder="portrait, cinematic, neon"></label></div><label>Description<textarea id="description" rows="3" placeholder="Short description..."></textarea></label><label>Prompt<textarea id="prompt" rows="8" required placeholder="Write the full AI image prompt here..."></textarea></label><button id="saveBtn" type="submit">Publish prompt</button><button id="cancelBtn" type="button" class="ghost hidden">Cancel edit</button></form></section>
<section class="panel"><div class="list-head"><h2>Published prompts</h2><button id="refresh" class="ghost">Refresh</button></div><div id="posts"></div></section></div></section></main></div><div id="toast"></div><script src="admin.js"></script></body></html>
